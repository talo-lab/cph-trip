<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Days of Design 2026 · Copenhagen Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c8492a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link rel="stylesheet" href="/styles.css">
<!-- 데이터 파일: 탭 진입 시 지연 로드. prefetch로 백그라운드 다운로드만 선행 -->
<link rel="prefetch" href="/events-data.js" as="script">
<link rel="prefetch" href="/exhibitions-data.js" as="script">
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="panel">
    <header class="brand">
      <div class="kicker"><span>COPENHAGEN · DENMARK</span><span class="dot"></span></div>
      <h1>3 Days of <em>Design</em><br>2026</h1>
      <div class="sub">JUN 8 — JUN 16 · 미주 & 상효 · "Make This Moment Matter"</div>
      <div class="user-selector" id="userSelector">
        <button class="user-sel-btn" type="button" data-user="miju">미주</button>
        <button class="user-sel-btn" type="button" data-user="sanghyo">상효</button>
      </div>
    </header>

    <!-- 뉴스 티커 (3DoD 공지 / Journal) -->
    <div class="ticker-wrap is-hidden" id="tickerWrap" aria-live="polite">
      <span class="ticker-label">LIVE</span>
      <div class="ticker-scroll"><div class="ticker-track" id="tickerTrack"></div></div>
    </div>

    <div class="tabs" role="tablist" aria-label="여행 플래너 메뉴">
      <button class="tab active" type="button" role="tab" aria-selected="true"  data-tab="plan"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x=".5" y="2" width="11" height="9.5" rx=".7"/><path d="M.5 5.5h11M3.5.5v3M8.5.5v3"/></svg><span>일정</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="rec"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6,1 7.4,4.6 11.1,4.6 8.3,7.1 9.3,11 6,8.9 2.7,11 3.7,7.1 .9,4.6 4.6,4.6"/></svg><span>추천</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="exh"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 11.5V6.2L6 1.5l4.5 4.7v5.3"/><rect x="4" y="7.5" width="4" height="4"/></svg><span>쇼룸</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="fest"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6,1 11,5 6,11 1,5"/><path d="M1,5h10"/></svg><span>3DoD</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="add"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 1C4 1 2.5 2.5 2.5 4.5c0 3 3.5 6.5 3.5 6.5s3.5-3.5 3.5-6.5C9.5 2.5 8 1 6 1z"/><path d="M4.5 4.5h3M6 3v3"/></svg><span>＋장소</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="dist"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 2.5l3.5 1.3v7.5L1 10zM4.5 3.8l3-1.3v7.5l-3 1.3zM7.5 2.5l3.5 1.5v7.5L7.5 10z"/></svg><span>지구</span></button>
      <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="info"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="5.2"/><path d="M6 5.5v3.5M6 3.5v.7"/></svg><span>정보</span></button>
    </div>

    <div class="scroll" id="scroll" role="tabpanel" aria-live="polite"></div>

    <div class="saver" id="saver" aria-live="polite"><span class="pulse"></span> 자동 저장됨</div>
    <button class="reset" id="reset" type="button">초기화</button>

    <!-- 일정 항목 컨텍스트 드로어 -->
    <div class="item-drawer" id="itemDrawer">
      <div class="drawer-head">
        <span class="drawer-icon">✦ AI</span>
        <span class="drawer-label" id="drawerLabel"></span>
        <button class="drawer-action" id="drawerMapBtn" type="button" title="지도에서 경로 보기" aria-label="지도에서 경로 보기"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 2.5l4 1.5v8.5L1 11zM5 4l4-1.5v8.5L5 12.5zM9 2.5l4 1.5v8.5L9 11z"/></svg></button>
        <a class="drawer-action drawer-gmap-btn is-hidden" id="drawerGmapBtn" href="#" target="_blank" rel="noopener" title="Google Maps로 열기" aria-label="Google Maps로 열기">G</a>
        <button class="drawer-action muted" id="drawerLocToggle" type="button" title="위치 링크 편집" aria-label="위치 링크 편집">📍</button>
        <button class="drawer-action danger is-hidden" id="drawerDeleteBtn" type="button" title="이 일정 삭제" aria-label="이 일정 삭제">🗑</button>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="드로어 닫기">✕</button>
      </div>
      <div class="drawer-privacy" id="drawerPrivacy">
        <div class="drawer-privacy-row">
          <span class="drawer-privacy-label">참가자</span>
          <button class="drawer-with-btn" type="button" data-with="both">👥 함께</button>
          <button class="drawer-with-btn" type="button" data-with="miju">👩 미주만</button>
          <button class="drawer-with-btn" type="button" data-with="sanghyo">🧑 상효만</button>
        </div>
        <div class="drawer-privacy-row">
          <span class="drawer-privacy-label">공개</span>
          <button class="drawer-vis-btn" type="button" data-vis="shared">공유</button>
          <button class="drawer-vis-btn" type="button" data-vis="personal">🔒 나만보기</button>
        </div>
      </div>
      <!-- 위치 링크 편집 (토글) -->
      <div class="drawer-loc-row is-hidden" id="drawerLocRow">
        <span class="drawer-loc-icon" aria-hidden="true">📍</span>
        <input class="drawer-loc-input" id="drawerLocInput" type="text" placeholder="Google Maps URL 또는 장소명 붙여넣기...">
        <button class="drawer-loc-save" id="drawerLocSave" type="button">저장</button>
        <button class="drawer-loc-reset" id="drawerLocReset" type="button" title="초기화 (자동 생성으로 복원)">↺</button>
        <button class="drawer-loc-reset" id="drawerPinReset" type="button" title="핀 위치 재검색 (제목 기반)">📍↺</button>
      </div>
      <div class="drawer-quick-chips" id="drawerQuickChips">
        <button class="drawer-qchip" type="button" data-q="이 곳에 어떻게 가는지, 소요시간은 얼마나 잡아야 하는지, 추천 여행 팁을 알려줘"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 2.5l3.5 1.3v7.5L1 10zM4.5 3.8l3-1.3v7.5l-3 1.3zM7.5 2.5l3.5 1.5v7.5L7.5 10z"/></svg> 여행 팁</button>
        <button class="drawer-qchip" type="button" data-q="이 장소의 영업시간, 입장료, 예약 필요 여부를 알려줘"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="5.2"/><path d="M6 3.5v3l2 1.2"/></svg> 운영 정보</button>
        <button class="drawer-qchip" type="button" data-q="이 일정 다음에 근처에서 점심이나 커피 마시기 좋은 곳을 추천해줘"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2v3.5c0 1.93 1.57 3.5 3.5 3.5h1c1.93 0 3.5-1.57 3.5-3.5V2"/><path d="M8 2c.7 0 1.5.3 1.5 1.5S8.7 5 8 5"/><path d="M5 9v1.5M3.5 10.5h5"/></svg> 근처 식당</button>
      </div>
      <div class="drawer-row">
        <textarea class="drawer-input" id="drawerInput" rows="2" placeholder="이 일정에 대해 자유롭게 요청하세요..."></textarea>
        <button class="drawer-send" id="drawerSend" type="button">전송</button>
      </div>
      <div class="drawer-status" id="drawerStatus" aria-live="polite"></div>
      <div class="drawer-response" id="drawerResponse">
        <div class="drawer-resp-intro" id="drawerRespIntro"></div>
        <div class="drawer-options" id="drawerOptions"></div>
        <div class="drawer-followup" id="drawerFollowup" style="display:none"></div>
        <div class="drawer-resp-actions" id="drawerRespActions"></div>
      </div>
    </div>
    <!-- 일정 추가 확정 바: 패널 하단 플로팅 (스크롤 무관하게 항상 접근 가능) -->
    <div class="drawer-confirm-bar" id="drawerConfirmBar">
      <div class="confirm-bar-label">✦ 일정에 추가</div>
      <div class="confirm-bar-row">
        <input class="confirm-title-input" id="confirmTitle" type="text" placeholder="장소명">
        <input class="confirm-time-input" id="confirmTime" type="text" placeholder="시간" maxlength="5">
        <select class="confirm-day-sel" id="confirmDay"></select>
      </div>
      <div class="confirm-bar-row">
        <button class="confirm-add-btn" id="confirmAddBtn" type="button">＋ 일정 추가</button>
        <button class="drawer-dismiss-btn" id="drawerDismiss2" type="button">닫기</button>
      </div>
    </div>
  </aside>

  <!-- MAP -->
  <main class="map-wrap">
    <div class="map-handle" id="mapHandle" role="button" tabindex="0" aria-label="지도 패널 높이 변경"><div class="map-handle-bar"></div></div>
    <div id="map"></div>
    <div class="map-legend" id="mapLegend">
      <div class="leg-toggle" id="legToggle">
        <h4>8 Design Districts</h4>
        <span class="leg-toggle-icon">▾</span>
      </div>
      <div class="leg-body" id="legend"></div>
    </div>
    <button class="gps-btn" id="gpsBtn" type="button" title="내 위치 찾기">◎ 내 위치</button>
    <div class="gps-info" id="gpsInfo" aria-live="polite"></div>
    <div class="map-title">10–12 JUN · 8 DISTRICTS · 460+ BRANDS</div>
  </main>
</div>

<!-- LOGIN MODAL -->
<div class="login-overlay is-hidden" id="loginOverlay">
  <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="login-hd">
      <div class="kicker">COPENHAGEN · 2026</div>
      <h2 id="loginTitle">3 Days of <em>Design</em></h2>
    </div>
    <div class="login-bd">
      <p class="login-lead">누구로 접속할까요?</p>
      <div class="login-users">
        <button class="login-user-btn" type="button" data-user="miju">👩 미주</button>
        <button class="login-user-btn" type="button" data-user="sanghyo">🧑 상효</button>
      </div>
      <div id="loginPwRow" style="display:none">
        <div class="login-pw-row">
          <input type="password" class="login-pw-inp" id="loginPw" placeholder="비밀번호">
          <button class="login-pw-sub" id="loginSub" type="button">입장 →</button>
        </div>
        <div class="login-err" id="loginErr"></div>
      </div>
    </div>
    <button class="login-skip" id="loginSkip" type="button">이 기기에만 저장 (로컬 모드)</button>
  </div>
</div>

<script src="/app.js?v=20260611a"></script>
</body>
</html>
